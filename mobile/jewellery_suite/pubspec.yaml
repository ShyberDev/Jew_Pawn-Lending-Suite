name: jewellery_suite
description: "Offline-first mobile app for the Jewellery + Pawn + Khatabook + Lending suite."
publish_to: "none"
version: 1.0.4+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.0
  intl: ^0.20.2
  provider: ^6.1.2
  sqflite_common_ffi_web: ^1.2.0
  sqlite3: ^3.6.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/whatsapp.png
